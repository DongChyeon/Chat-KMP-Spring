# 로컬 개발 전용. 운영 환경 설정이 아니다.
#
# DB는 잠정 선택이다. 로드맵 1단계 결정 게이트에서 확정한다(ADR로 기록).
# Redis 같은 추가 인프라는 필요해지는 단계에서 결정 게이트를 거쳐 추가한다.
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: chat
      POSTGRES_USER: chat
      POSTGRES_PASSWORD: chat
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat -d chat"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
