spring.application.name=chat-server

# 로컬 개발용 DB (docker-compose.yml). 운영 값은 환경 변수로 덮어쓴다.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/chat}
spring.datasource.username=${DB_USERNAME:chat}
spring.datasource.password=${DB_PASSWORD:chat}

# ADR 0004: 로컬에서만 ddl-auto를 쓴다
spring.jpa.hibernate.ddl-auto=update

# 실제로 나가는 SQL 확인 (ADR 0003)
logging.level.org.hibernate.SQL=debug
spring.jpa.properties.hibernate.format_sql=true

# JWT (ADR 0009, 0012). 운영에서는 반드시 JWT_SECRET 환경 변수로 덮어쓴다.
# HS256 키는 최소 256비트(32바이트)여야 한다.
jwt.secret=${JWT_SECRET:local-dev-only-secret-do-not-use-in-production-0123456789}
jwt.access-token-ttl=15m
jwt.refresh-token-ttl=30d
